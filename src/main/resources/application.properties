# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=proyecto-servicios
# Zona horaria del negocio: fechas de los filtros y horaLocal de GestoPago
app.zona-horaria=${APP_ZONA_HORARIA:America/Mexico_City}
server.port=8080

# Deshabilitar conexión obligatoria a Config Server remoto para pruebas locales
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:


# ===================================================================
# CONFIGURACIÓN DE SERIALIZACIÓN JACKSON
# Exclusión global de propiedades nulas en peticiones y respuestas
# ===================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================================================
# CONFIGURACIÓN DE SERVICIO EXTERNO (PUNTORED / GESTOPAGO)
# Especificación Postman: GET /sistema/service/getProductList.do
# ===================================================================
# URL base del servicio externo PuntoRed / GestoPago
servicio.externo.productos.url=${PRODUCTOS_SERVICE_URL:https://gestopago.portalventas.net}

# Bearer Token de autenticación para el servicio externo
servicio.externo.productos.token=${PRODUCTOS_SERVICE_TOKEN:qmzAAEYFmqQbIT/Ktxme8Akih4Md6cXf9hTHKjfO626aEN8GrvSLaA9CJP3Q1UI5bL6/tDk+nsTwmGoUwm3VR+LPbGaB13DSSR2d+wUdceRZ4Mb28E6jMqxsHW7wzN8R6LwhtU9wB6m7ROuvUvtQvw==}

# API-Key opcional asignada por PuntoRed
servicio.externo.productos.api-key=${PRODUCTOS_SERVICE_API_KEY:YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8}

# Ruta específica del endpoint para consultar la lista de productos
servicio.externo.productos.endpoint.get-products=${PRODUCTOS_ENDPOINT_GET_LIST:/sistema/service/getProductList.do}

# Timeouts de conexión y lectura en milisegundos (62s máximo recomendado por PuntoRed)
servicio.externo.productos.connect-timeout=${PRODUCTOS_CONNECT_TIMEOUT:5000}
servicio.externo.productos.read-timeout=${PRODUCTOS_READ_TIMEOUT:62000}


# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL / PGADMIN)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pago_servicios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# CONFIGURACIÓN DE GESTOPAGO (Existente en el proyecto)
# ===================================================================
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
# Revisión periódica del token (cada hora); solo se pide uno nuevo cuando el actual está por vencer
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}
# Vigencia que se le da al token: GestoPago lo invalida a las 24 h y exige pedir solo uno por día
gestopago.auth.vigencia-horas=${GESTOPAGO_TOKEN_VIGENCIA_HORAS:23}

# ===================================================================
# CONFIGURACIÓN DE REDIS (CACHÉ EN MEMORIA)
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
catalogo.redis.key=${CATALOGO_REDIS_KEY:catalogo:productos}
catalogo.redis.ttl-hours=${CATALOGO_REDIS_TTL_HOURS:24}

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD Y SESIONES (ONBOARDING CLIENTES)
# ===================================================================
seguridad.crypto.secret-key=${CRYPTO_SECRET_KEY:MiClaveSecretaSuperSegura2026AES}
seguridad.sesion.default-timeout-seconds=${SESION_DEFAULT_TIMEOUT:300}

# ===================================================================
# CONFIGURACIÓN DE SPRINGDOC / SWAGGER UI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.proyecto.servicios.controller
springdoc.show-actuator=false
spring.jpa.open-in-view=false

# ===================================================================
# SEGURIDAD DE LA API (JWT, ROLES Y EXPOSICIÓN DE ERRORES)
# ===================================================================
# Clave HMAC de los tokens (mínimo 32 caracteres). Si no se define se genera una aleatoria al arrancar.
seguridad.jwt.secret=${JWT_SECRET:}
seguridad.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:30}
# Ejecutivo con acceso a todos los clientes. Sin EJECUTIVO_PASSWORD el login de ejecutivo queda deshabilitado.
seguridad.ejecutivo.usuario=${EJECUTIVO_USUARIO:ejecutivo}
seguridad.ejecutivo.password=${EJECUTIVO_PASSWORD:}
# No se usa el usuario en memoria que Spring Security genera por defecto
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Nunca exponer trazas, mensajes internos ni errores de binding en las respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# Actuator: solo health, sin detalles internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Redis es una caché opcional del catálogo (si no responde se usa PostgreSQL): no debe marcar la API como caída
management.health.redis.enabled=${HEALTH_REDIS_ENABLED:false}

# ===================================================================
# TRANSACCIONES GESTOPAGO (sendTx / confirmTx)
# ===================================================================
gestopago.transaccion.url=${GESTOPAGO_TX_URL:https://gestopago.portalventas.net}
gestopago.transaccion.endpoint.send-tx=${GESTOPAGO_ENDPOINT_SEND_TX:/sistema/service/sendTx.do}
gestopago.transaccion.endpoint.confirm-tx=${GESTOPAGO_ENDPOINT_CONFIRM_TX:/sistema/service/confirmTx.do}
gestopago.api-key=${GESTOPAGO_API_KEY:${servicio.externo.productos.api-key:}}
# Unidad comercial o sucursal que se reporta en cada transacción (3 a 25 caracteres)
gestopago.transaccion.unidad=${GESTOPAGO_UNIDAD:083}
# Zona horaria del campo horaLocal (yyyyMMddHHmmss)
gestopago.transaccion.zona-horaria=${GESTOPAGO_ZONA_HORARIA:${app.zona-horaria}}
# GestoPago responde a más tardar en 62 s; confirmTx no debe invocarse antes de ese tiempo ni después de 24 h
gestopago.transaccion.connect-timeout-ms=${GESTOPAGO_CONNECT_TIMEOUT:5000}
gestopago.transaccion.read-timeout-ms=${GESTOPAGO_READ_TIMEOUT:62000}
gestopago.transaccion.espera-confirmacion-segundos=${GESTOPAGO_ESPERA_CONFIRMACION:62}
# Llave AES-256 e IV en Base64 entregados por GestoPago (por defecto, el par de prueba de su documentación)
gestopago.cifrado.secret-key=${GESTOPAGO_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.cifrado.iv=${GESTOPAGO_IV:p5ldmBPdd/9pjC0bDC/nSg==}
# Emisor que muestra la aplicación de autenticación (Google Authenticator, Microsoft Authenticator, etc.)
seguridad.dos-factores.emisor=${DOS_FACTORES_EMISOR:ProyectoApi}
