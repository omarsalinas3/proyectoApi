# ===================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ===================================================================
spring.application.name=proyecto-servicios
server.port=8080

# ===================================================================
# CONFIGURACIÓN DE SERIALIZACIÓN JACKSON
# Exclusión global de propiedades nulas en peticiones y respuestas
# ===================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================================================
# CONFIGURACIÓN DE SERVICIO EXTERNO (PRODUCTOS / SISTEMA)
# Endpoint: GET /sistema/service/getProductList.do
# ===================================================================
# URL base del servicio externo (configurable vía variable de entorno)
servicio.externo.productos.url=${PRODUCTOS_SERVICE_URL:https://api.externa.com}

# Bearer Token de autenticación para el servicio externo
servicio.externo.productos.token=${PRODUCTOS_SERVICE_TOKEN:default_bearer_token_aqui}

# Ruta específica del endpoint para consultar la lista de productos
servicio.externo.productos.endpoint.get-products=${PRODUCTOS_ENDPOINT_GET_LIST:/sistema/service/getProductList.do}

# Timeouts de conexión y lectura en milisegundos
servicio.externo.productos.connect-timeout=${PRODUCTOS_CONNECT_TIMEOUT:5000}
servicio.externo.productos.read-timeout=${PRODUCTOS_READ_TIMEOUT:10000}

# ===================================================================
# CONFIGURACIÓN DE GESTOPAGO (Existente en el proyecto)
# ===================================================================
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://api.gestopago.com}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:1}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:DEV001}
gestopago.auth.password=${GESTOPAGO_PASSWORD:secret}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}
