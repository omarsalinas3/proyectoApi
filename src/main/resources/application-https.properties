# ===================================================================
# PERFIL "https": la API sirve TLS directamente (desarrollo local)
# ===================================================================
# Uso: genere el certificado con scripts/generar-certificado-tls.sh y arranque con
#   SPRING_PROFILES_ACTIVE=https API_TLS_PASSWORD=... java -jar build/libs/prueba-1.0.jar
# No se activa en Render: ahí el HTTPS lo termina su proxy y el contenedor debe escuchar HTTP.
server.port=${SERVER_PORT:8443}
server.ssl.bundle=api
server.http2.enabled=true

# La llave privada vive fuera del repositorio (certs/ está en .gitignore) y la contraseña solo llega por variable de
# entorno: sin API_TLS_PASSWORD la aplicación no arranca, en lugar de usar una contraseña por defecto.
spring.ssl.bundle.jks.api.keystore.location=${API_TLS_KEYSTORE:file:certs/api-tls.p12}
spring.ssl.bundle.jks.api.keystore.password=${API_TLS_PASSWORD}
spring.ssl.bundle.jks.api.keystore.type=PKCS12
spring.ssl.bundle.jks.api.key.alias=proyecto-api
spring.ssl.bundle.jks.api.options.enabled-protocols=TLSv1.3,TLSv1.2
