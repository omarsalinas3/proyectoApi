# ===================================================================
# PLANTILLA de secretos para desarrollo local
# ===================================================================
# 1. Copie este archivo como config/secretos-locales.properties (ese nombre está en .gitignore).
# 2. Llene los valores. NUNCA suba el archivo copiado ni escriba llaves en application.properties.
# En Render los mismos valores se configuran en Environment con los nombres de variable indicados.

# Contraseña de PostgreSQL local (DB_PASSWORD)
spring.datasource.password=

# Contraseña del distribuidor en GestoPago (GESTOPAGO_PASSWORD). Sandbox: la de la colección Postman de GestoPago.
gestopago.auth.password=

# Llave AES-256 e IV en Base64 entregados por GestoPago (GESTOPAGO_SECRET_KEY, GESTOPAGO_IV).
# Sandbox: el par de prueba de la sección "Encryption" de la documentación de GestoPago.
gestopago.cifrado.secret-key=
gestopago.cifrado.iv=

# API key opcional de GestoPago/PuntoRed (PRODUCTOS_SERVICE_API_KEY)
servicio.externo.productos.api-key=

# Llave con la que se cifran los usuarios, el secreto 2FA y la biometría en la base (CRYPTO_SECRET_KEY).
# Debe ser la MISMA en todos los ambientes que comparten base de datos: si cambia, los datos guardados ya no se leen.
seguridad.crypto.secret-key=
